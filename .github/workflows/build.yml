name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prep Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Build release + debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.p12
          STORE_PASSWORD: v3relay-upload-2026
          KEY_PASSWORD: v3relay-upload-2026
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: v3-relay-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v3-relay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
